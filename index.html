<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Credit Run</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffc400; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; top: 16px; left: 16px; display: flex; gap: 10px; align-items: center;
         background: #111; color: #fff; padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 18px; }
  #hud .coin { width: 22px; height: 22px; border-radius: 50%; background: #ffc400; color: #111; display: grid; place-items: center; font-size: 13px; }
  #help { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(17,17,17,.82); color: #fff;
          padding: 8px 16px; border-radius: 999px; font-size: 13px; white-space: nowrap; }
  #help b { color: #ffc400; }
  #loading { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; justify-items: center; gap: 14px; background: #ffc400; color: #111; font-weight: 700; font-size: 18px; transition: opacity .5s; }
  #loading.gone { opacity: 0; pointer-events: none; }
  #loading .spin { width: 42px; height: 42px; border-radius: 50%; border: 5px solid rgba(17,17,17,.2); border-top-color: #111; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #toast { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: 800; color: #fff;
           text-shadow: 0 3px 0 #e52600; opacity: 0; transition: opacity .25s; pointer-events: none; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="hud"><span class="coin">C</span><span id="credits">0</span></div>
<div id="toast"></div>
<div id="loading"><div class="spin"></div><div>Loading <span id="loadpct"></span></div></div>
<div id="help"><b>↑ ↓</b> walk &nbsp; <b>← →</b> turn &nbsp; <b>Shift</b> run &nbsp; <b>Space</b> jump &nbsp; <b>C</b> front view &nbsp; <b>N</b> day / night &nbsp; <b>M</b> sound</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 300);

const hemi = new THREE.HemisphereLight(0xeaf4ff, 0xd9c7a8, 1.55); scene.add(hemi);
const fill = new THREE.DirectionalLight(0xfff6ea, 1.0);      // soft light from the camera so the face is never in shadow
camera.add(fill, fill.target); fill.target.position.set(0, -.15, -1); scene.add(camera);
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 });
scene.add(sun, sun.target);

/* ---------- helpers ---------- */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function denim(base, rep = 3) {
  const t = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++) {
      g.fillStyle = Math.random() > .5 ? 'rgba(255,255,255,.10)' : 'rgba(20,40,80,.10)';
      const x = Math.random() * w, y = Math.random() * h;
      g.fillRect(x, y, 1, 3 + Math.random() * 5);
    }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep);
  return new THREE.MeshStandardMaterial({ map: t, roughness: .9 });
}
const mat = (color, rough = .7) => new THREE.MeshStandardMaterial({ color, roughness: rough });
function mesh(geo, material, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(geo, material); m.position.set(x, y, z);
  m.castShadow = true; if (parent) parent.add(m); return m;
}
function group(x = 0, y = 0, z = 0, parent) { const g = new THREE.Group(); g.position.set(x, y, z); if (parent) parent.add(g); return g; }

/* ---------- character (low-poly, flat shaded) ---------- */
const LP = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: .88, side: THREE.DoubleSide });
// turn any geometry into faceted low-poly: nudge verts, give each triangle its own shade
function lp(geo, color, jitter = 0, vary = .06) {
  const p = geo.attributes.position;
  if (jitter) for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const h = n => { const s = Math.sin(x * 127.1 * n + y * 311.7 + z * 74.7 * n) * 43758.5453; return s - Math.floor(s) - .5; };
    p.setXYZ(i, x + h(1) * jitter, y + h(2) * jitter, z + h(3) * jitter);
  }
  const g = geo.index ? geo.toNonIndexed() : geo;
  const n = g.attributes.position.count, col = new Float32Array(n * 3), c = new THREE.Color(color);
  for (let i = 0; i < n; i += 3) {
    const k = 1 + (Math.random() - .5) * 2 * vary;
    for (let j = 0; j < 3; j++) col.set([c.r * k, c.g * k, c.b * k], (i + j) * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}
const part = (geo, color, x, y, z, parent, jitter = 0, vary) => mesh(lp(geo, color, jitter, vary), LP, x, y, z, parent);

function buildHair(color) {
  // one wavy shell: dome on top, opens around the face, flares and flips at the ends
  const NT = 16, NV = 10, pos = [], idx = [];
  const ss = THREE.MathUtils.smoothstep;
  for (let j = 0; j <= NV; j++) {
    const v = j / NV; let r, y;
    if (v < .35) { const ph = v / .35 * Math.PI / 2; r = .152 * Math.sin(ph); y = .02 + .15 * Math.cos(ph); }
    else { const u = (v - .35) / .65; r = .152 + .042 * u + .028 * ss(u, .7, 1) - .03 * ss(u, .93, 1); y = .02 - u * .3 + .02 * ss(u, .8, 1); }
    const u = Math.max(0, (v - .35) / .65), open = ss(v, .2, .42) * .82;
    for (let i = 0; i <= NT; i++) {
      const th = THREE.MathUtils.lerp(-(Math.PI - open), Math.PI - open, i / NT);
      const rr = r * (1 + .1 * Math.sin(th * 5 + v * 10) * Math.min(1, u * 2));
      pos.push(rr * Math.sin(th), y, -rr * Math.cos(th) * .97);
    }
  }
  for (let j = 0; j < NV; j++) for (let i = 0; i < NT; i++) {
    const a = j * (NT + 1) + i, b = a + 1, c = a + NT + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  const hair = group(0, 0, -0.012);
  mesh(lp(g, color, .006, .09), LP, 0, 0, 0, hair);
  part(new THREE.IcosahedronGeometry(0.136, 1), color, 0, 0.03, -0.02, hair, 0, .09).scale.set(1, 1.05, 1.02);   // fills the crown
  return hair;
}

function buildCharacter() {
  const C = { denim: 0x6f81b5, band: 0x6477ab, hair: 0x4a2f27, skin: 0xdca680, skinD: 0xcf9773, top: 0x1c1a1d,
              shoe: 0xece7df, sole: 0xd6d0c6, btn: 0x8e857f, white: 0xffffff, iris: 0x4b2b1b, dark: 0x1a1110, lip: 0xb7574f };
  const gold = new THREE.MeshStandardMaterial({ color: 0xd9a441, metalness: .8, roughness: .3 });

  const root = group();
  const body = group(0, 0, 0, root);          // bob / squash
  const hips = group(0, 0.93, 0, body);

  // high-waisted wide-leg jeans
  part(new THREE.CylinderGeometry(0.15, 0.186, 0.22, 8, 1), C.denim, 0, 0, 0, hips, .004).scale.z = .78;
  part(new THREE.CylinderGeometry(0.153, 0.153, 0.035, 8), C.band, 0, 0.118, 0, hips).scale.z = .78;
  part(new THREE.CylinderGeometry(0.01, 0.01, 0.006, 6), C.btn, 0, 0.118, 0.121, hips).rotation.x = Math.PI / 2;
  function leg(side) {
    const hip = group(side * 0.098, -0.05, 0, hips); hip.rotation.z = side * .035;
    part(new THREE.CylinderGeometry(0.09, 0.098, 0.42, 8, 2), C.denim, 0, -0.21, 0, hip, .004);
    const knee = group(0, -0.42, 0, hip);
    part(new THREE.IcosahedronGeometry(0.096, 1), C.denim, 0, 0, 0, knee);
    part(new THREE.CylinderGeometry(0.098, 0.12, 0.41, 8, 2), C.denim, 0, -0.205, 0, knee, .004);
    part(new THREE.CylinderGeometry(0.122, 0.123, 0.03, 8), C.band, 0, -0.4, 0, knee);
    part(new THREE.BoxGeometry(0.105, 0.065, 0.25, 2, 1, 3), C.shoe, 0, -0.385, 0.06, knee, .008);   // chunky sneaker
    part(new THREE.BoxGeometry(0.118, 0.05, 0.275), C.sole, 0, -0.435, 0.06, knee);
    return { hip, knee };
  }
  const legL = leg(1), legR = leg(-1);

  // torso: black top, cropped open denim jacket
  const torso = group(0, 0, 0, hips);
  part(new THREE.CylinderGeometry(0.16, 0.142, 0.36, 8, 2), C.top, 0, 0.3, 0, torso, .004).scale.z = .68;
  part(new THREE.CylinderGeometry(0.06, 0.158, 0.05, 8), C.skin, 0, 0.505, 0, torso).scale.z = .68;
  part(new THREE.BoxGeometry(0.075, 0.075, 0.012), C.skin, 0, 0.478, 0.103, torso).rotation.z = Math.PI / 4;   // V neckline
  part(new THREE.CylinderGeometry(0.044, 0.05, 0.11, 7), C.skin, 0, 0.575, 0, torso);
  const chain = mesh(new THREE.TorusGeometry(0.075, 0.0028, 4, 12, Math.PI), gold, 0, 0.535, 0.045, torso); chain.rotation.set(-.8, 0, Math.PI);
  mesh(new THREE.OctahedronGeometry(0.009), gold, 0, 0.477, 0.113, torso);

  const gap = 0.33, arc = Math.PI * 2 - gap * 2;
  part(new THREE.CylinderGeometry(0.2, 0.192, 0.4, 10, 2, true, gap, arc), C.denim, 0, 0.32, 0, torso, .006).scale.z = .74;
  part(new THREE.CylinderGeometry(0.085, 0.2, 0.055, 10, 1, true, gap, arc), C.denim, 0, 0.5475, 0, torso).scale.z = .74;        // shoulder yoke
  part(new THREE.CylinderGeometry(0.198, 0.198, 0.045, 10, 1, true, gap * .9, Math.PI * 2 - gap * 1.8), C.band, 0, 0.125, 0, torso).scale.z = .74; // hem band
  part(new THREE.CylinderGeometry(0.075, 0.095, 0.05, 8, 1, true, 1.1, Math.PI * 2 - 2.2), C.band, 0, 0.59, -0.005, torso).scale.z = .85;  // collar stand
  for (const s of [1, -1]) {
    part(new THREE.IcosahedronGeometry(0.076, 1), C.denim, s * 0.188, 0.488, 0, torso);                                   // shoulder
    const collar = part(new THREE.BoxGeometry(0.105, 0.02, 0.08), C.band, s * 0.082, 0.56, 0.07, torso); collar.rotation.set(.55, -s * .45, s * .4);
    const pk = group(s * 0.118, 0.37, 0.121, torso); pk.rotation.y = s * .5;
    part(new THREE.BoxGeometry(0.082, 0.08, 0.008), C.band, 0, -0.022, 0, pk);
    part(new THREE.BoxGeometry(0.088, 0.032, 0.014), C.denim, 0, 0.03, 0.002, pk);
    part(new THREE.CylinderGeometry(0.0075, 0.0075, 0.006, 6), C.btn, 0, 0.026, 0.011, pk).rotation.x = Math.PI / 2;
    if (s > 0) part(new THREE.BoxGeometry(0.007, 0.02, 0.004), 0xd22630, -0.045, 0.004, 0.006, pk);                       // red tab
  }
  for (let i = 0; i < 5; i++) part(new THREE.CylinderGeometry(0.008, 0.008, 0.006, 6), C.btn, -0.072, 0.15 + i * 0.075, 0.138, torso).rotation.x = Math.PI / 2;

  // arms
  function arm(side) {
    const shoulder = group(side * 0.225, 0.485, 0, torso);
    part(new THREE.CylinderGeometry(0.058, 0.054, 0.27, 7, 2), C.denim, 0, -0.135, 0, shoulder, .005);
    const elbow = group(0, -0.27, 0, shoulder);
    part(new THREE.IcosahedronGeometry(0.055, 1), C.denim, 0, 0, 0, elbow);
    part(new THREE.CylinderGeometry(0.054, 0.056, 0.24, 7, 2), C.denim, 0, -0.12, 0, elbow, .005);
    part(new THREE.CylinderGeometry(0.061, 0.061, 0.048, 7), C.band, 0, -0.245, 0, elbow);
    part(new THREE.CylinderGeometry(0.007, 0.007, 0.006, 6), C.btn, side * 0.06, -0.245, 0, elbow).rotation.z = Math.PI / 2;
    part(new THREE.BoxGeometry(0.042, 0.105, 0.076, 1, 2, 1), C.skin, 0, -0.32, 0.004, elbow, .006);                    // hand
    part(new THREE.BoxGeometry(0.022, 0.045, 0.022), C.skin, -side * 0.006, -0.3, 0.042, elbow).rotation.x = -.35;        // thumb
    return { shoulder, elbow };
  }
  const armL = arm(1), armR = arm(-1);

  // head
  const head = group(0, 0.75, 0.005, torso); head.scale.setScalar(1.22);
  const sk = new THREE.IcosahedronGeometry(0.115, 2), sp = sk.attributes.position;
  for (let i = 0; i < sp.count; i++) {
    let x = sp.getX(i), y = sp.getY(i), z = sp.getZ(i);
    if (y < 0) { const t = -y / 0.115; x *= 1 - .3 * t * t - .08 * t; z *= 1 - .1 * t; y *= 1.22; } else y *= 1.08;
    sp.setXYZ(i, x * .96, y, z);
  }
  part(sk, C.skin, 0, 0, 0, head, 0, .035);
  for (const s of [1, -1]) {
    part(new THREE.SphereGeometry(0.021, 8, 6), C.white, s * 0.043, 0.006, 0.097, head, 0, 0).scale.set(1.15, .95, .45);
    part(new THREE.SphereGeometry(0.0135, 8, 6), C.iris, s * 0.043, 0.006, 0.105, head, 0, 0).scale.set(1, 1, .4);
    part(new THREE.SphereGeometry(0.007, 6, 5), C.dark, s * 0.043, 0.006, 0.109, head, 0, 0).scale.z = .4;
    part(new THREE.SphereGeometry(0.0035, 5, 4), C.white, s * 0.043 + 0.005, 0.012, 0.111, head, 0, 0);
    part(new THREE.BoxGeometry(0.05, 0.006, 0.01), C.dark, s * 0.044, 0.026, 0.1, head).rotation.z = -s * .1;           // lash line
    part(new THREE.BoxGeometry(0.052, 0.012, 0.012), C.hair, s * 0.046, 0.052, 0.098, head).rotation.set(0, s * .3, -s * .16);  // brow
    part(new THREE.CircleGeometry(0.02, 6), 0xd98d74, s * 0.068, -0.03, 0.083, head, 0, 0).rotation.y = s * .65;        // blush
  }
  const nose = part(new THREE.ConeGeometry(0.015, 0.04, 4), C.skinD, 0, -0.022, 0.112, head); nose.rotation.set(-.35, Math.PI / 4, 0);
  const lipS = new THREE.Shape(); lipS.moveTo(-.036, 0); lipS.quadraticCurveTo(0, -.012, .036, 0); lipS.quadraticCurveTo(0, -.05, -.036, 0);
  const teethS = new THREE.Shape(); teethS.moveTo(-.027, -.005); teethS.quadraticCurveTo(0, -.014, .027, -.005); teethS.quadraticCurveTo(0, -.03, -.027, -.005);
  part(new THREE.ShapeGeometry(lipS, 4), C.lip, 0, -0.052, 0.1, head, 0, 0).rotation.x = .12;
  part(new THREE.ShapeGeometry(teethS, 4), C.white, 0, -0.052, 0.102, head, 0, 0).rotation.x = .12;

  const hair = buildHair(C.hair); head.add(hair);

  return { root, body, hips, torso, head, legL, legR, armL, armR, hair };
}

let ch = buildCharacter();      // stand-in skeleton only; it is shown only if the real model cannot be loaded
let ready = false;

/* ---------- real model: rigged GLB, posed through its own skeleton ---------- */
// The model has a humanoid skeleton but no animation clips. Idle / walk / run are motion-capture clips borrowed
// from a reference skeleton and copied across bone by bone; the jump is a hand-made pose blended in while airborne.
const ARM_OUT = 0.06;          // how far the resting arms sit away from the body (radians)
const ARM_SPREAD = 0.26;       // the clips were made for a slimmer body: hold the arms this much further out so they clear the jacket
const STANCE = 0.12;           // ...and bring the wide idle stance in by this much
const MOCAP_URL = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/Xbot.glb';
function setupRig(gltf) {
  const root = group(), body = group(0, 0, 0, root), model = group(0, 0, 0, body);
  model.add(gltf.scene);
  let skinned;
  gltf.scene.traverse(o => { if (o.isSkinnedMesh) skinned = o; if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
  if (skinned.material.map) skinned.material.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const bone = n => gltf.scene.getObjectByName(n);
  const wp = o => o.getWorldPosition(new THREE.Vector3());
  const wq = o => o.getWorldQuaternion(new THREE.Quaternion());

  // turn the model to face +Z, scale it to 1.68 m and stand it on the ground
  root.updateMatrixWorld(true);
  const toe = new THREE.Vector3();
  for (const s of ['Left', 'Right']) toe.add(wp(bone(s + '_Toes'))).sub(wp(bone(s + '_Foot')));
  model.rotation.y = -Math.atan2(toe.x, toe.z);
  root.updateMatrixWorld(true); skinned.skeleton.update(); skinned.computeBoundingBox();
  const box = skinned.boundingBox.clone().applyMatrix4(skinned.matrixWorld), hp = wp(bone('Hips'));
  const k = 1.68 / (box.max.y - box.min.y);
  model.scale.setScalar(k); model.position.set(-hp.x * k, -box.min.y * k, -hp.z * k);
  root.updateMatrixWorld(true);

  // remember every bone's rest orientation so rotations can be given in plain character axes (x left, y up, z forward)
  const rest = new Map();
  gltf.scene.traverse(o => { if (o.isBone) { const w = wq(o); rest.set(o.name, { b: o, local: o.quaternion.clone(), w, wInv: w.clone().invert(), pw: wq(o.parent) }); } });
  const apply = (name, q) => { const r = rest.get(name); if (r) r.b.quaternion.copy(r.local).multiply(r.wInv).multiply(q).multiply(r.w); };

  const leftIsPlusX = wp(bone('Left_UpperArm')).x > 0;
  const sides = [{ s: 1, n: leftIsPlusX ? 'Left' : 'Right' }, { s: -1, n: leftIsPlusX ? 'Right' : 'Left' }];
  const HANG = new THREE.Vector3(0, -1, .1).normalize(), X = new THREE.Vector3(1, 0, 0);
  for (const S of sides) {       // rotation that takes the T-pose arm to hanging at the side, a touch forward
    const dir = wp(bone(S.n + '_LowerArm')).sub(wp(bone(S.n + '_UpperArm'))).normalize();
    S.q0 = new THREE.Quaternion().setFromUnitVectors(dir, HANG);
    S.clav = new THREE.Quaternion().slerp(S.q0, .1); S.clavInv = S.clav.clone().invert();
    S.elbowAxis = X.clone().applyQuaternion(S.q0.clone().invert());
  }
  const feet = ['Left_Foot', 'Right_Foot', 'Left_Toes', 'Right_Toes'].map(n => ({ b: bone(n), y: wp(bone(n)).y }));
  const hipsRestY = wp(bone('Hips')).y;

  const J = () => new THREE.Object3D();
  const out = { root, body, hips: J(), torso: J(), head: J(), hair: J(),
                legL: { hip: J(), knee: J() }, legR: { hip: J(), knee: J() }, armL: { shoulder: J(), elbow: J() }, armR: { shoulder: J(), elbow: J() } };
  const q = new THREE.Quaternion(), q2 = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3();
  const qe = (x, y, z) => new THREE.Quaternion().setFromEuler(e.set(x, y, z));
  const frac = (src, f) => new THREE.Quaternion().slerp(src, f);

  function handPose(run) {       // relaxed fingers, closing into a loose fist when running
    for (const S of sides) {
      const curl = qe(0, 0, -S.s * (.3 + run * .5));
      for (const f of ['Index', 'Middle', 'Ring', 'Pinky']) for (const p of ['Proximal', 'Intermediate', 'Distal']) apply(S.n + '_' + f + p, curl);
    }
  }
  function handMadePose() {      // the simple joints animate() writes, transferred to the real bones
    apply('Hips', out.hips.quaternion);
    const third = frac(out.torso.quaternion, 1 / 3);
    apply('Spine', third); apply('Chest', third); apply('UpperChest', third);
    apply('Neck', frac(out.head.quaternion, .4)); apply('Head', frac(out.head.quaternion, .6));
    for (const S of sides) {
      const leg = S.s > 0 ? out.legL : out.legR, arm = S.s > 0 ? out.armL : out.armR;
      const hx = leg.hip.rotation.x, kx = leg.knee.rotation.x;
      apply(S.n + '_UpperLeg', qe(hx, 0, 0)); apply(S.n + '_LowerLeg', qe(kx, 0, 0));
      apply(S.n + '_Foot', qe(-(hx + kx) * .45, 0, 0));
      const total = qe(arm.shoulder.rotation.x, 0, arm.shoulder.rotation.z + S.s * ARM_OUT).multiply(S.q0);
      apply(S.n + '_Shoulder', S.clav);
      apply(S.n + '_UpperArm', q.copy(S.clavInv).multiply(total));
      apply(S.n + '_LowerArm', new THREE.Quaternion().setFromAxisAngle(S.elbowAxis, arm.elbow.rotation.x));
    }
  }

  // --- motion capture ---
  const MAP = { Hips: 'Hips', Spine: 'Spine', Chest: 'Spine1', UpperChest: 'Spine2', Neck: 'Neck', Head: 'Head' };
  for (const [t, m] of [['Shoulder', 'Shoulder'], ['UpperArm', 'Arm'], ['LowerArm', 'ForeArm'], ['Hand', 'Hand'], ['UpperLeg', 'UpLeg'], ['LowerLeg', 'Leg'], ['Foot', 'Foot'], ['Toes', 'ToeBase']])

  } else {
    const turn = (keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0);
    const fwd = (keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0);
    const running = fwd > 0 && (keys.ShiftLeft || keys.ShiftRight);
    P.yaw += turn * TURN * dt;
    const target = fwd > 0 ? (running ? RUN : WALK) : fwd < 0 ? -WALK * .6 : 0;
    P.speed = damp(P.speed, target, P.grounded ? 9 : 2, dt);

    if (keys.Space && P.grounded) { P.vy = JUMP; P.grounded = false; sfx.jump(); }

    const dx = (Math.sin(P.yaw) * P.speed + P.kx) * dt, dz = (Math.cos(P.yaw) * P.speed + P.kz) * dt;
    P.kx = damp(P.kx, 0, 4, dt); P.kz = damp(P.kz, 0, 4, dt);
    P.pos.x = THREE.MathUtils.clamp(P.pos.x + dx, -(ROAD_W / 2 - .32), ROAD_W / 2 - .32);      // the footpath belongs to the pedestrians
    P.pos.z += dz; P.odo += Math.abs(dz);

    for (const s of stones) {                            // stones block you unless you clear them
      const ox = P.pos.x - s.x, oz = wd(P.pos.z - s.z), d = Math.hypot(ox, oz), min = s.r + .26;
      if (d < min && P.pos.y < s.top - .15) { const k = min / (d || 1e-3); P.pos.x = s.x + ox * k; P.pos.z += oz * k - oz; P.speed *= .6; }
    }

    P.vy -= GRAV * dt; P.pos.y += P.vy * dt;
    const g = groundAt(P.pos.x, P.pos.z);
    if (P.pos.y <= g) {
      if (!P.grounded && P.vy < -3) { P.land = 1; sfx.land(); }
      P.pos.y = g; P.vy = 0; P.grounded = true;
    } else if (P.pos.y > g + .05) P.grounded = false;

    let nearHole = false;
    for (const h of potholes) {
      const d = Math.hypot(P.pos.x - h.x, wd(P.pos.z - h.z));
      if (d < h.r + 1.3) nearHole = true;
      if (P.grounded && P.pos.y < .05 && d < h.r - .12) { P.falling = .7; sfx.pothole(); }
    }
    if (P.grounded && !nearHole) lastSafe.copy(P.pos);
  }

  updateAutos(dt, performance.now() / 1000);
  updateWalkers(dt);
  if (P.inv > 0) P.inv -= dt;
  ch.root.visible = !(P.inv > 0 && Math.floor(performance.now() / 80) % 2);   // blink after a hit

  // credits
  const t = performance.now() / 1000;
  for (const c of coins) {
    const twin = c.userData.twin, dz = wd(c.position.z - P.pos.z);
    c.rotation.y = twin.rotation.y = t * 3 + c.position.z;
    if (!c.visible) { if (Math.abs(dz) > 220) c.visible = twin.visible = true; continue; }      // back again by the time you come round the loop
    if (Math.abs(c.position.x - P.pos.x) < .6 && Math.abs(dz) < .6 && Math.abs(c.position.y - (P.pos.y + .9)) < 1.05) {
      c.visible = twin.visible = false; credits++; $credits.textContent = credits; sfx.coin(credits);
    }
  }
  if (toastT > 0 && (toastT -= dt) <= 0) $toast.style.opacity = 0;

  animate(dt, t);

  // camera + light follow
  const f = new THREE.Vector3(Math.sin(P.yaw + camOff), 0, Math.cos(P.yaw + camOff));
  const want = frontView ? P.pos.clone().addScaledVector(f, 2.6).add(new THREE.Vector3(0, 1.35, 0))
                         : P.pos.clone().addScaledVector(f, -4.8).add(new THREE.Vector3(0, 2.5, 0));
  want.y = Math.max(want.y, .6);
  camera.position.lerp(want, 1 - Math.exp(-6 * dt));
  camera.lookAt(P.pos.x, Math.max(P.pos.y, 0) + (frontView ? 1.1 : 1.25), P.pos.z);
  sun.position.set(P.pos.x + 8, 18, P.pos.z - 6); sun.target.position.set(P.pos.x, 0, P.pos.z);
  placeTiles(); setNight(nightAt(P.odo)); updateSound(dt, Math.max(0, nightNow)); waterMat.map.offset.x += dt * .012; waterMat.map.offset.y += dt * .02;
  const spy = window.__game && window.__game.spy; if (spy) { camera.position.set(spy.x, spy.y, spy.z); camera.lookAt(spy.tx, spy.ty, spy.tz); }   // debug: park the camera somewhere
  sky.position.copy(camera.position); nightSky.position.copy(camera.position); clouds.position.set(camera.position.x, 0, camera.position.z); clouds.rotation.y += dt * .004;
}

/* ---------- procedural animation: idle / walk / run / jump ---------- */
function animate(dt, t) {
  const sp = Math.abs(P.speed), dir = Math.sign(P.speed) || 1;
  P.move = damp(P.move, Math.min(1, sp / WALK), 10, dt);
  P.run = damp(P.run, THREE.MathUtils.clamp((sp - WALK) / (RUN - WALK), 0, 1), 8, dt);
  P.air = damp(P.air, P.grounded ? 0 : 1, 14, dt);
  P.land = damp(P.land, 0, 9, dt);
  const stepBefore = Math.floor(P.phase / Math.PI);
  P.phase += dt * lerp(7.2, 11.5, P.run) * Math.min(1, sp / WALK) * dir;
  if (P.grounded && sp > .6 && Math.floor(P.phase / Math.PI) !== stepBefore) sfx.step(P.run > .5);

  const { move, run, air, phase } = P, g = 1 - air;
  const s = Math.sin(phase), c = Math.cos(phase);
  const amp = lerp(.36, .78, run) * move, kAmp = lerp(.6, 1.35, run) * move;

  ch.root.position.copy(P.pos); ch.root.rotation.y = P.yaw;
  ch.body.position.y = (Math.abs(c) * lerp(.035, .09, run) * move - .02 * move) * g - P.land * .1;
  ch.body.scale.y = 1 - P.land * .08;

  // legs
  ch.legL.hip.rotation.x = (-s * amp) * g + air * -.75;
  ch.legR.hip.rotation.x = (s * amp) * g + air * .25;
  ch.legL.knee.rotation.x = (Math.max(0, c) * kAmp + .05 * move) * g + air * 1.25 + P.land * .5;
  ch.legR.knee.rotation.x = (Math.max(0, -c) * kAmp + .05 * move) * g + air * .9 + P.land * .5;
  ch.legL.hip.rotation.x -= P.land * .35; ch.legR.hip.rotation.x -= P.land * .35;

  // torso + head
  ch.hips.rotation.y = s * .12 * move * g;
  ch.torso.rotation.x = lerp(.03, .24, run) * move + air * -.08 + P.land * .25;
  ch.torso.rotation.y = -s * .16 * move * g;
  ch.torso.rotation.z = Math.sin(t * 1.3) * .012 * (1 - move);
  ch.torso.scale.setScalar(1 + Math.sin(t * 2) * .006 * (1 - move));
  ch.head.rotation.z = (ch.rig ? 0 : lerp(.13, 0, move)) + Math.sin(t * .8) * .02;      // the head tilt from the photo
  ch.head.rotation.x = -run * .14 + air * -.1;
  ch.head.rotation.y = s * .1 * move * g;

  // arms
  const aAmp = lerp(.38, .95, run) * move;
  ch.armR.shoulder.rotation.x = (-s * aAmp) * g + air * -1.9;
  ch.armR.elbow.rotation.x = -(.12 + run * 1.25 + Math.max(0, -s) * .3 * move) * g - air * .35;
  ch.armL.shoulder.rotation.x = (s * aAmp) * g + air * -1.5;
  ch.armL.elbow.rotation.x = -(.12 + run * 1.25 + Math.max(0, s) * .3 * move) * g - air * .5;
  ch.armR.shoulder.rotation.z = -.1 - air * .25; ch.armL.shoulder.rotation.z = .1 + air * .25;

  // hair trails a little when moving and lifts on the way down from a jump
  ch.hair.rotation.x = damp(ch.hair.rotation.x, -run * .1 + Math.abs(c) * .04 * move, 10, dt);
  ch.hair.scale.y = damp(ch.hair.scale.y, 1 - THREE.MathUtils.clamp(P.vy, -8, 4) * .012, 10, dt);

  if (ch.rig) ch.rig.pose({ run, move, air, land: P.land, speed: P.speed, dt, falling: P.falling > 0 });
}

/* ---------- loop ---------- */
camera.position.set(0, 1.4, 3);       // the game opens on the character, then swings behind (see startGame)
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (ready) update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
window.__game = { S, sfx, LEN, LZ0, LZ1, walkers, autos, stones, potholes, P, get ch() { return ch; }, keys, get credits() { return credits; }, camera, spy: null, setFront(v) { frontView = v; }, orbit(a) { camOff = a; } };
</script>
</body>
</html>
